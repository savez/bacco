server {
    listen 80;
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/bacco.pem;
    ssl_certificate_key /etc/nginx/certs/bacco-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Il mime type di .webmanifest è aggiunto direttamente a /etc/nginx/mime.types nel
    # Dockerfile: un blocco "types" qui sostituirebbe per intero la tabella
    # ereditata da http (mime.types), servendo tutto come application/octet-stream.

    # Fallback SPA: nessun add_header qui, eredita quelli del livello server.
    location / {
        try_files $uri /index.html;
    }

    # File che devono essere ricontrollati a ogni avvio (altrimenti l'aggiornamento
    # dell'app e del service worker non verrebbe mai rilevato).
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /theme-init.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Asset con nome contenente l'hash: cache lunga e immutabile.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Tutte le altre location (root compresa) ereditano queste intestazioni dal
    # livello server, perché non definiscono un proprio add_header.
    include /etc/nginx/security-headers.conf;
}
