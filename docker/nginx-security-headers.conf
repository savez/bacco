# Intestazioni di sicurezza (costituzione, principio II). Incluso esplicitamente in ogni
# location che definisce un proprio add_header, perché nginx scarta le intestazioni
# ereditate dal livello server non appena una location ne definisce una propria.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data: https://tile.openstreetmap.org; connect-src 'self' https://world.openfoodfacts.org; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
