services:
  dev:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_POLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  web:
    build: .
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs-local:ro

  # Landing (solo sul branch `landing`): http://localhost:4321/bacco/
  landing:
    image: node:24-alpine
    working_dir: /app/landing
    volumes:
      - .:/app
      - landing_node_modules:/app/landing/node_modules
    ports:
      - "4321:4321"
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
  landing_node_modules:
