name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, test e build
    runs-on: ubuntu-latest
    steps:
      # Il branch `landing` contiene solo il sito su GitHub Pages: non va mai unito a main.
      # Questo controllo è obbligatorio, quindi una PR da `landing` non si può unire.
      - name: Blocca le PR dal branch landing
        if: github.head_ref == 'landing'
        run: |
          echo "::error::Il branch 'landing' non va mai unito a main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
