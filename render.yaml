# Blueprint Render: sito statico della PWA. Da creare con New → Blueprint (non "Static Site"),
# altrimenti le intestazioni qui sotto vengono ignorate.
# Le intestazioni di sicurezza sono le stesse di docker/nginx-security-headers.conf
# (costituzione, principio II): tenerle allineate.
services:
  - type: web
    name: bacco
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: '24'
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(self), geolocation=(self), microphone=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      # File con hash nel nome: si possono tenere in cache per sempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Service worker, pagina e manifest vanno sempre riverificati, altrimenti gli
      # aggiornamenti dell'app non arrivano.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      # Applicazione a pagina singola: /bottiglia/:id, /mappa… vengono gestiti dal router.
      - type: rewrite
        source: /*
        destination: /index.html
